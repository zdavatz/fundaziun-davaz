[package]
name = "fundaziun-davaz"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[[bin]]
name = "stiftungen"
path = "src/stiftungen.rs"

[[bin]]
name = "bildinventar"
path = "src/bildinventar.rs"

[[bin]]
name = "stellungnahme"
path = "src/stellungnahme.rs"

[[bin]]
name = "bewilligung"
path = "src/bewilligung.rs"

[[bin]]
name = "aktendossier"
path = "src/aktendossier.rs"

[[bin]]
name = "seitenlage"
path = "src/seitenlage.rs"

[dependencies]
anyhow = "1"
genpdf = { version = "0.2", features = ["images"] }
lopdf = "0.34"
image = "0.23"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSDictionary"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "objc2-core-graphics"] }
objc2-image-io = { version = "0.3", features = ["CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
objc2-core-foundation = "0.3"
